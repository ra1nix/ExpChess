<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Chess Engine الشارح</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #1e1e1e; color: #ffffff; display: flex; justify-content: center; align-items: flex-start; gap: 25px; padding: 30px; margin: 0; }

        .main-container { display: flex; gap: 15px; align-items: flex-start; }

        .eval-bar-container {
            width: 28px;
            height: 400px;
            background-color: #262421;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            border: 1px solid #444;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }
        .eval-bar-fill {
            width: 100%;
            background-color: #e2e2e2;
            transition: height 0.4s ease-in-out;
            height: 50%;
        }
        .eval-bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 11px;
            font-weight: bold;
            z-index: 10;
            pointer-events: none;
            color: #1e1e1e;
        }

        #board { width: 400px; height: 400px; display: grid; grid-template-columns: repeat(8, 1fr); border: 2px solid #444; border-radius: 4px; overflow: hidden; direction: ltr; }
        .board-middle { display: flex; }
        .rank-labels { display: flex; flex-direction: column; }
        .rank-labels div { width: 16px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }
        .file-labels { display: flex; }
        .file-labels div { width: 50px; height: 16px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: #999; }
        .square { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 34px; cursor: pointer; user-select: none; }
        .white-sq { background: #f0d9b5; color: #000; }
        .black-sq { background: #b58863; color: #000; }
        .highlight { background: #7fc97f !important; }
        .selected { background: #f5f682 !important; }

        .bot-header { display: flex; align-items: center; justify-content: space-between; }
        .bot-container { margin-bottom: 15px; width: 400px; }
        .speech-bubble {
            background: #2a2a2a;
            border: 2px solid #007bff;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 14px;
            line-height: 1.5;
            color: #e0e0e0;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            min-height: 60px;
        }

        .sidebar { width: 280px; background: #252526; padding: 20px; border-radius: 8px; border: 1px solid #333; display: flex; flex-direction: column; gap: 15px; }
        .control-group { display: flex; flex-direction: column; gap: 5px; }
        label { font-size: 13px; color: #aaa; }
        select, button { padding: 8px 12px; border-radius: 4px; border: 1px solid #444; background: #333; color: #fff; font-size: 14px; cursor: pointer; }
        select:focus, button:focus { outline: none; border-color: #007bff; }
        button.btn-action { background: #007bff; border: none; font-weight: bold; margin-top: 5px; }
        button.btn-action:hover { background: #0056b3; }
        button.btn-undo { background: #6c757d; border: none; font-weight: bold; }
        button.btn-undo:hover { background: #5a6268; }

        .highlight-toggle {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid #444;
            background: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .highlight-toggle.active {
            background: #007bff;
            border-color: #007bff;
        }

        .history-box {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 4px;
            height: 160px;
            overflow-y: auto;
            padding: 5px;
        }
        .history-table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: center; }
        .history-table td { padding: 4px; border-bottom: 1px solid #2a2a2a; }
        .history-table th { color: #888; font-weight: normal; padding-bottom: 5px; border-bottom: 1px solid #444; }
    </style>
</head>
<body>

    <div>
        <div class="bot-container">
            <div class="bot-header">
                <strong style="color: #007bff;">🤖 شرح المحرك:</strong>
                <div class="highlight-toggle" id="highlightToggle" title="إظهار/إخفاء الحركات الممكنة" onclick="toggleHighlights()">💡</div>
            </div>
            <div class="speech-bubble" id="botBubble">جاري التحميل...</div>
        </div>

        <div class="main-container">
            <div class="eval-bar-container">
                <div class="eval-bar-text" id="evalText">0.0</div>
                <div class="eval-bar-fill" id="evalFill"></div>
            </div>

            <div>
                <div class="board-middle">
                    <div id="board"></div>
                    <div class="rank-labels" id="rankLabels"></div>
                </div>
                <div class="file-labels" id="fileLabels"></div>
            </div>
        </div>
    </div>

    <div class="sidebar">
        <h3 style="margin: 0 0 5px 0; font-size: 18px;">التحكم باللعبة</h3>

        <div class="control-group">
            <label>لون اللاعب:</label>
            <select id="colorSelect" onchange="resetGame()">
                <option value="white" selected>أبيض (White)</option>
                <option value="black">أسود (Black)</option>
            </select>
        </div>

        <div style="display: flex; gap: 8px;">
            <button class="btn-undo" style="flex: 1;" onclick="undoMove()">تراجع ↩</button>
            <button class="btn-action" style="flex: 1;" onclick="resetGame()">لعبة جديدة</button>
        </div>

        <div class="control-group">
            <label>سجل الحركات (Move History):</label>
            <div class="history-box" id="historyBox">
                <table class="history-table">
                    <thead><tr><th>#</th><th>أبيض</th><th>أسود</th></tr></thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const unicodePieces = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟',
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'
        };

        let selectedSquare = null;
        let currentPlayerColor = 'white';
        let highlightsEnabled = false;
        let gameOver = false;
        let isThinking = false;

        function toggleHighlights() {
            highlightsEnabled = !highlightsEnabled;
            const btn = document.getElementById('highlightToggle');
            if (highlightsEnabled) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        }

        async function updateBoard() {
            const res = await fetch('/api/state');
            const data = await res.json();
            currentPlayerColor = data.player_color;
            renderFen(data.fen);
            updateUI(data);
        }

        function fenToMatrix(fen) {
            const matrix = Array(8).fill(null).map(() => Array(8).fill(''));
            const rows = fen.split(' ')[0].split('/');
            for (let r = 0; r < 8; r++) {
                let c = 0;
                for (let char of rows[r]) {
                    if (!isNaN(char)) c += parseInt(char);
                    else { matrix[r][c] = char; c++; }
                }
            }
            return matrix;
        }

        function renderFen(fen) {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            const matrix = fenToMatrix(fen);

            const rowOrder = currentPlayerColor === 'white' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];
            const colOrder = currentPlayerColor === 'white' ? [0,1,2,3,4,5,6,7] : [7,6,5,4,3,2,1,0];

            for (let r of rowOrder) {
                for (let c of colOrder) {
                    const sqName = String.fromCharCode(97 + c) + (8 - r);
                    const piece = matrix[r][c];

                    const sq = document.createElement('div');
                    sq.className = `square ${(r + c) % 2 === 0 ? 'white-sq' : 'black-sq'}`;
                    sq.dataset.square = sqName;
                    sq.innerText = unicodePieces[piece] || '';
                    sq.onclick = () => handleSquareClick(sqName);

                    boardEl.appendChild(sq);
                }
            }

            renderLabels();
        }

        function renderLabels() {
            const files = currentPlayerColor === 'white' ? ['h','g','f','e','d','c','b','a'] : ['a','b','c','d','e','f','g','h'];
            const ranks = currentPlayerColor === 'white' ? [8,7,6,5,4,3,2,1] : [1,2,3,4,5,6,7,8];

            const rankEl = document.getElementById('rankLabels');
            rankEl.innerHTML = '';
            ranks.forEach(r => {
                const div = document.createElement('div');
                div.innerText = r;
                rankEl.appendChild(div);
            });

            const fileEl = document.getElementById('fileLabels');
            fileEl.innerHTML = '';
            files.forEach(f => {
                const div = document.createElement('div');
                div.innerText = f;
                fileEl.appendChild(div);
            });
        }

        function updateUI(data) {
            document.getElementById('botBubble').innerText = data.explanation;

            if (data.game_status === 'checkmate') {
                gameOver = true;
                updateEvalBarMate(data.winner);
            } else if (data.game_status === 'draw') {
                gameOver = true;
                updateEvalBarDraw();
            } else {
                gameOver = false;
                updateEvalBar(data.eval);
            }

            renderHistory(data.san_history);
        }

        function updateEvalBarMate(winner) {
            const fillEl = document.getElementById('evalFill');
            const textEl = document.getElementById('evalText');

            if (winner === 'white') {
                fillEl.style.height = '100%';
                fillEl.style.backgroundColor = '#ffffff';
                textEl.style.bottom = '8px'; textEl.style.top = 'auto'; textEl.style.color = '#1e1e1e';
            } else {
                fillEl.style.height = '0%';
                fillEl.style.backgroundColor = '#1e1e1e';
                textEl.style.top = '8px'; textEl.style.bottom = 'auto'; textEl.style.color = '#ffffff';
            }
            textEl.innerText = 'M0';
        }

        function updateEvalBarDraw() {
            const fillEl = document.getElementById('evalFill');
            const textEl = document.getElementById('evalText');

            fillEl.style.height = '50%';
            fillEl.style.backgroundColor = '#e2e2e2';
            textEl.style.top = 'auto'; textEl.style.bottom = '8px'; textEl.style.color = '#1e1e1e';
            textEl.innerText = '0.0';
        }

        function updateEvalBar(score) {
            let percentage = 50 + (2 / (1 + Math.exp(-0.35 * score)) - 1) * 50;
            percentage = Math.max(5, Math.min(95, percentage));

            const fillEl = document.getElementById('evalFill');
            const textEl = document.getElementById('evalText');

            fillEl.style.backgroundColor = '#e2e2e2';
            fillEl.style.height = `${percentage}%`;
            textEl.innerText = score > 0 ? `+${score.toFixed(1)}` : score.toFixed(1);

            if (percentage > 50) {
                textEl.style.bottom = '8px'; textEl.style.top = 'auto'; textEl.style.color = '#1e1e1e';
            } else {
                textEl.style.top = '8px'; textEl.style.bottom = 'auto'; textEl.style.color = '#ffffff';
            }
        }

        function renderHistory(sanHistory) {
            const body = document.getElementById('historyBody');
            body.innerHTML = '';
            for (let i = 0; i < sanHistory.length; i += 2) {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="color:#666">${Math.floor(i/2) + 1}.</td>
                    <td>${sanHistory[i] || ''}</td>
                    <td>${sanHistory[i+1] || ''}</td>
                `;
                body.appendChild(tr);
            }
            const box = document.getElementById('historyBox');
            box.scrollTop = box.scrollHeight;
        }

        async function handleSquareClick(sqName) {
            if (gameOver || isThinking) {
                return;
            }

            if (!selectedSquare) {
                selectedSquare = sqName;
                document.querySelector(`[data-square="${sqName}"]`)?.classList.add('selected');

                if (highlightsEnabled) {
                    const res = await fetch('/api/legal_moves', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({square: sqName})
                    });
                    const data = await res.json();
                    data.legal_moves.forEach(target => {
                        document.querySelector(`[data-square="${target}"]`)?.classList.add('highlight');
                    });
                }
            } else {
                const move = selectedSquare + sqName;
                selectedSquare = null;
                document.querySelectorAll('.square').forEach(el => el.classList.remove('selected', 'highlight'));

                isThinking = true;
                document.getElementById('botBubble').innerText = 'المحرك يفكر...';

                const res = await fetch('/api/move', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({move: move})
                });

                isThinking = false;

                const data = await res.json();
                if (data.status === 'success' || data.status === 'game_over') {
                    renderFen(data.fen);
                    updateUI(data);
                }
            }
        }

        async function undoMove() {
            const res = await fetch('/api/undo', {method: 'POST'});
            const data = await res.json();
            if (data.status === 'success') {
                renderFen(data.fen);
                updateUI(data);
            }
        }

        async function resetGame() {
            const color = document.getElementById('colorSelect').value;
            const res = await fetch('/api/reset', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({player_color: color})
            });
            const data = await res.json();
            currentPlayerColor = data.player_color;
            renderFen(data.fen);
            updateUI(data);
        }

        updateBoard();
    </script>
</body>
</html>
